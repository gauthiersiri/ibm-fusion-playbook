---
# roles/fusion_data_foundation/tasks/wait_storage_cluster.yml
# Poll StorageCluster until phase is "Ready".
# Ceph bootstrap (MON, MGR, OSD, MDS, RGW, NooBaa) typically takes 10-20 min.

- name: "[fdf/sc_wait] Wait for StorageCluster to reach Ready phase"
  kubernetes.core.k8s_info:
    host: "{{ _k8s_auth.host }}"
    api_key: "{{ _k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ _k8s_auth.validate_certs }}"
    api_version: ocs.openshift.io/v1
    kind: StorageCluster
    name: "{{ fdf_storage_cluster_name }}"
    namespace: "{{ fdf_namespace }}"
  register: _sc_status
  until: >-
    _sc_status.resources | length > 0
    and (_sc_status.resources[0].status | default({})).phase | default('') == 'Ready'
  retries: "{{ (fdf_sc_wait_seconds | int / fdf_poll_interval_seconds | int) | int }}"
  delay: "{{ fdf_poll_interval_seconds | int }}"

- name: "[fdf/sc_wait] StorageCluster is Ready"
  ansible.builtin.debug:
    msg:
      - "=== FDF StorageCluster ==="
      - "Name    : {{ fdf_storage_cluster_name }}"
      - "Phase   : {{ _sc_status.resources[0].status.phase }}"
      - "Version : {{ _sc_status.resources[0].status.version | default('n/a') }}"
