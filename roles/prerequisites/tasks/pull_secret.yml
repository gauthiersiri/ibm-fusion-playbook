---
# roles/prerequisites/tasks/pull_secret.yml
# Add IBM Entitled Registry (cp.icr.io) credentials to the global cluster pull secret.
#
# Reference: https://www.ibm.com/docs/en/fusion-software/2.14.0?topic=prerequisites-creating-image-pull-secret
#
# The pull secret is ONLY patched if cp.icr.io is not already present.
# The global pull secret update triggers a MachineConfig rollout (nodes restart one by one).

# ---- Read existing pull secret ----
- name: "[pull_secret] Read existing global pull secret"
  kubernetes.core.k8s_info:
    host: "{{ _k8s_auth.host }}"
    api_key: "{{ _k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ _k8s_auth.validate_certs }}"
    api_version: v1
    kind: Secret
    name: pull-secret
    namespace: openshift-config
  register: _global_ps
  no_log: true

- name: "[pull_secret] Decode existing .dockerconfigjson"
  ansible.builtin.set_fact:
    _existing_auths: >-
      {{
        (_global_ps.resources[0].data['.dockerconfigjson']
         | b64decode | from_json).get('auths', {})
      }}
  no_log: true

# ---- Guard: only patch if cp.icr.io absent ----
- name: "[pull_secret] Check if cp.icr.io entry already exists"
  ansible.builtin.set_fact:
    _cp_icr_present: "{{ 'cp.icr.io' in _existing_auths }}"
  no_log: true

- name: "[pull_secret] cp.icr.io already present — skipping"
  ansible.builtin.debug:
    msg: "cp.icr.io already present in openshift-config/pull-secret. Nothing to do."
  when: _cp_icr_present

# ---- Merge only if absent ----
- name: "[pull_secret] Merge cp.icr.io into global pull secret"
  when: not _cp_icr_present
  block:
    - name: "[pull_secret] Build merged .dockerconfigjson"
      ansible.builtin.set_fact:
        _merged_dockerconfig: >-
          {{
            {
              'auths': _existing_auths | combine({
                'cp.icr.io': {
                  'auth': ('cp:' ~ ocp_entitlement_key) | b64encode
                }
              })
            } | to_json
          }}
      no_log: true

    - name: "[pull_secret] Patch global pull secret (openshift-config/pull-secret)"
      kubernetes.core.k8s:
        host: "{{ _k8s_auth.host }}"
        api_key: "{{ _k8s_auth.api_key | default(omit) }}"
        kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"
        validate_certs: "{{ _k8s_auth.validate_certs }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: pull-secret
            namespace: openshift-config
          data:
            .dockerconfigjson: "{{ _merged_dockerconfig | b64encode }}"
      no_log: true

    - name: "[pull_secret] Global pull secret updated"
      ansible.builtin.debug:
        msg: >
          cp.icr.io credentials merged into openshift-config/pull-secret.
          Note: OCP will now trigger a MachineConfig rollout (nodes will restart one by one).
