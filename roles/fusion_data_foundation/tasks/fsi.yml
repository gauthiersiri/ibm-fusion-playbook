---
# roles/fusion_data_foundation/tasks/fsi.yml
# Create the FusionServiceInstance for Data Foundation.
#
# Reference: https://www.ibm.com/docs/en/fusion-software/2.14.0?topic=services-deploying-fusion-using-cli
# backingStorageType: Local — uses LSO + local block devices.
# Valid values: Local | Dynamic | External (capitalise first letter).
#
# Note: both local and provider deployment modes use backingStorageType: Local.
# The provider mode distinction is applied at the StorageCluster level (hostNetwork:true),
# not at the FusionServiceInstance level.
# ref: IBM Fusion Software 2.14, Configuring FDF in provider mode — "Before you begin:
#      Fusion Data Foundation service is installed with device type set to Local."

- name: "[fdf/fsi] Check if FusionServiceInstance {{ fdf_fsi_name }} already exists"
  kubernetes.core.k8s_info:
    host: "{{ _k8s_auth.host }}"
    api_key: "{{ _k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ _k8s_auth.validate_certs }}"
    api_version: service.isf.ibm.com/v1
    kind: FusionServiceInstance
    name: "{{ fdf_fsi_name }}"
    namespace: "{{ fusion_namespace }}"
  register: _fsi_check

- name: "[fdf/fsi] FusionServiceInstance already exists — skipping creation"
  ansible.builtin.debug:
    msg: "FusionServiceInstance '{{ fdf_fsi_name }}' already exists. Skipping."
  when: _fsi_check.resources | length > 0

- name: "[fdf/fsi] Create FusionServiceInstance (Data Foundation — Local)"
  kubernetes.core.k8s:
    host: "{{ _k8s_auth.host }}"
    api_key: "{{ _k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ _k8s_auth.validate_certs }}"
    state: present
    definition: "{{ lookup('template', 'fsi_data_foundation.j2') | from_yaml }}"
  when: _fsi_check.resources | length == 0

- name: "[fdf/fsi] FusionServiceInstance submitted"
  ansible.builtin.debug:
    msg:
      - "FusionServiceInstance : {{ fdf_fsi_name }}"
      - "backingStorageType    : Local"
      - "deployment mode       : {{ fdf_deployment_mode }}"
      - "FDF namespace         : {{ fdf_namespace }}"
