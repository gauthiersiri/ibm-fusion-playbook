---
# roles/multicluster_engine/tasks/credentials.yml
# Create the KubeVirt credentials Secret used by MCE to provision
# Hosted Control Plane clusters via OpenShift Virtualization.
#
# The secret mirrors what the MCE UI creates under
# "Infrastructure > Credentials > Add credential > OpenShift Virtualization":
#   - pullSecret  : global OCP pull secret (extracted from openshift-config/pull-secret)
#   - ssh-publickey: SSH public key injected into HCP node VMs
#
# Skipped entirely if hcp_ssh_public_key is empty.

- name: "[mce/creds] Skip — hcp_ssh_public_key not set"
  ansible.builtin.debug:
    msg: "hcp_ssh_public_key is empty — skipping KubeVirt credentials creation."
  when: hcp_ssh_public_key | length == 0

- name: "[mce/creds] Check OpenShift Virtualization is installed"
  kubernetes.core.k8s_info:
    host: "{{ _k8s_auth.host }}"
    api_key: "{{ _k8s_auth.api_key | default(omit) }}"
    kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"
    validate_certs: "{{ _k8s_auth.validate_certs }}"
    api_version: hco.kubevirt.io/v1beta1
    kind: HyperConverged
    name: kubevirt-hyperconverged
    namespace: openshift-cnv
  register: _cnv_check
  when: hcp_ssh_public_key | length > 0

- name: "[mce/creds] Skip — OpenShift Virtualization not installed"
  ansible.builtin.debug:
    msg: "HyperConverged CR not found — KubeVirt credentials require CNV. Skipping."
  when:
    - hcp_ssh_public_key | length > 0
    - _cnv_check.resources | default([]) | length == 0

- name: "[mce/creds] Create KubeVirt credentials secret"
  when:
    - hcp_ssh_public_key | length > 0
    - _cnv_check.resources | default([]) | length > 0
  block:
    - name: "[mce/creds] Read global pull secret from openshift-config"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_auth.host }}"
        api_key: "{{ _k8s_auth.api_key | default(omit) }}"
        kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"
        validate_certs: "{{ _k8s_auth.validate_certs }}"
        api_version: v1
        kind: Secret
        name: pull-secret
        namespace: openshift-config
      register: _global_pull_secret
      no_log: true

    - name: "[mce/creds] Check if credentials secret already exists"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_auth.host }}"
        api_key: "{{ _k8s_auth.api_key | default(omit) }}"
        kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"
        validate_certs: "{{ _k8s_auth.validate_certs }}"
        api_version: v1
        kind: Secret
        name: "{{ hcp_credentials_name }}"
        namespace: "{{ hcp_credentials_namespace }}"
      register: _hcp_creds_check

    - name: "[mce/creds] KubeVirt credentials secret already exists — skipping"
      ansible.builtin.debug:
        msg: "Secret '{{ hcp_credentials_name }}' already exists in {{ hcp_credentials_namespace }}. Skipping."
      when: _hcp_creds_check.resources | length > 0

    - name: "[mce/creds] Create KubeVirt credentials secret"
      kubernetes.core.k8s:
        host: "{{ _k8s_auth.host }}"
        api_key: "{{ _k8s_auth.api_key | default(omit) }}"
        kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"
        validate_certs: "{{ _k8s_auth.validate_certs }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ hcp_credentials_name }}"
            namespace: "{{ hcp_credentials_namespace }}"
            labels:
              cluster.open-cluster-management.io/credentials: ""
              cluster.open-cluster-management.io/type: kubevirt
          type: Opaque
          data:
            # Re-use the raw base64 value from the global pull secret as-is
            pullSecret: "{{ _global_pull_secret.resources[0].data['.dockerconfigjson'] }}"
            ssh-publickey: "{{ hcp_ssh_public_key | b64encode }}"
      when: _hcp_creds_check.resources | length == 0
      no_log: true

    - name: "[mce/creds] KubeVirt credentials secret created"
      ansible.builtin.debug:
        msg:
          - "Secret     : {{ hcp_credentials_name }}"
          - "Namespace  : {{ hcp_credentials_namespace }}"
          - "ssh-publickey: {{ hcp_ssh_public_key | regex_replace(' .*$', ' <truncated>') }}"
      when: _hcp_creds_check.resources | length == 0
