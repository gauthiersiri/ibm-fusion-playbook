---
# roles/multicluster_engine/defaults/main.yml

# Namespace — recommended to use "multicluster-engine"
# ref: Red Hat docs: "Best practice: Continue to use the multicluster-engine namespace if available."
mce_namespace: "multicluster-engine"

# OLM Subscription settings
# IMPORTANT: channel is versioned (stable-2.x) and must match the OCP version.
# MCE version / OCP compatibility matrix:
#   MCE 2.7  → OCP 4.20
#   MCE 2.8  → OCP 4.21
#   MCE 2.9  → OCP 4.22
# ref: https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/hosted_control_planes
# There is NO generic "stable" channel — mce_channel MUST be set explicitly.
mce_subscription_name: "multicluster-engine"
mce_source: "redhat-operators"
mce_source_namespace: "openshift-marketplace"

# mce_channel: leave empty to auto-detect from the cluster PackageManifest at runtime.
# Auto-detection reads olm.maxOpenShiftVersion from each stable-2.x channel and
# picks the highest one compatible with the cluster OCP version.
# Set explicitly only to pin a specific channel and skip auto-detection.
mce_channel: ""

# MultiClusterEngine CR name — must be "multiclusterengine" (only one allowed per cluster)
mce_instance_name: "multiclusterengine"

# KubeVirt credentials secret for HCP cluster provisioning via MCE.
# ref: Secret observed from MCE UI — "Create credential > OpenShift Virtualization"
#
# hcp_ssh_public_key: SSH public key injected into hosted cluster nodes.
#   Format: "ssh-ed25519 AAAA... user@host"
#   Leave empty ("") to skip credential creation entirely.
#
# The pullSecret is extracted automatically from openshift-config/pull-secret.
# The secret is created in the namespace defined by hcp_credentials_namespace.
hcp_credentials_name: "hcp-pull-secret"
hcp_credentials_namespace: "default"
hcp_ssh_public_key: ""   # set in host_vars — e.g. "ssh-ed25519 AAAA... user@host"

# Timing — MCE can take 10+ minutes to reach Available
mce_wait_seconds: 900
mce_poll_interval_seconds: 30
